<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popcorn time</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="corn">
    <i style="--x:-70px;--y:-40px;--d:0s"></i>
    <i style="--x:-40px;--y:-64px;--d:0.35s"></i>
    <i style="--x:-15px;--y:-46px;--d:0.7s"></i>
    <i style="--x:10px;--y:-72px;--d:0.2s"></i>
    <i style="--x:35px;--y:-50px;--d:0.9s"></i>
    <i style="--x:60px;--y:-58px;--d:0.5s"></i>
    <i style="--x:75px;--y:-36px;--d:1.1s"></i>
    <i style="--x:-55px;--y:-84px;--d:1.3s"></i>
    <i style="--x:-5px;--y:-96px;--d:1.6s"></i>
    <i style="--x:40px;--y:-86px;--d:1.45s"></i>
    <i style="--x:18px;--y:-112px;--d:1.8s"></i>
    <i style="--x:-30px;--y:-110px;--d:1.95s"></i>
  </div>
  <label for=go class="bucket"></label>
</div>
</body>
</html>
