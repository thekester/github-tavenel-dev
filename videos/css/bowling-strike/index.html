<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS bowling</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="lane">
  <div class="pins">
    <i style="--px:135px;--py:64px;--d:.15s"></i>
    <i style="--px:165px;--py:64px;--d:.15s"></i>
    <i style="--px:195px;--py:64px;--d:.15s"></i>
    <i style="--px:225px;--py:64px;--d:.15s"></i>
    <i style="--px:150px;--py:86px;--d:.1s"></i>
    <i style="--px:180px;--py:86px;--d:.1s"></i>
    <i style="--px:210px;--py:86px;--d:.1s"></i>
    <i style="--px:165px;--py:108px;--d:.05s"></i>
    <i style="--px:195px;--py:108px;--d:.05s"></i>
    <i style="--px:180px;--py:130px;--d:0s"></i>
  </div>
  <label for=go class="ball"></label>
  <p class="strike">STRIKE!</p>
</div>
</body>
</html>
