<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squeaky duck</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <b class="water"></b>
  <div class="bob">
    <div class="duck"><i></i></div>
  </div>
  <p class="squeak">SQUEAK!</p>
  <s style="--x:-60px;--d:.1s"></s>
  <s style="--x:-20px;--d:.3s"></s>
  <s style="--x:30px;--d:.2s"></s>
  <s style="--x:70px;--d:.45s"></s>
  <s style="--x:5px;--d:.6s"></s>
  <b class="tub"></b>
  <label for=go></label>
</div>
</body>
</html>
