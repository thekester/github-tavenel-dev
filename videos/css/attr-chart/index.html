<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A chart with its data in HTML</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <nav>
    <label>
      <input type="radio" name="w" id="wa" checked>
      This week
    </label>
    <label>
      <input type="radio" name="w" id="wb">
      Last week
    </label>
  </nav>
  <div class="chart">
    <i data-d="Mon" data-a="40" data-b="72"></i>
    <i data-d="Tue" data-a="65" data-b="48"></i>
    <i data-d="Wed" data-a="52" data-b="90"></i>
    <i data-d="Thu" data-a="88" data-b="35"></i>
    <i data-d="Fri" data-a="70" data-b="60"></i>
    <i data-d="Sat" data-a="30" data-b="84"></i>
    <i data-d="Sun" data-a="95" data-b="55"></i>
  </div>
</div>
</body>
</html>
