<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS roundabout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="cars">
    <i style="--c:#ef4444;--d:0s"></i>
    <i style="--c:#facc15;--d:-2s"></i>
    <i style="--c:#3b82f6;--d:-4s"></i>
    <i style="--c:#f8fafc;--d:-6s"></i>
    <i class=r style="--c:#a855f7;--d:-1s"></i>
    <i class=r style="--c:#f97316;--d:-3s"></i>
    <i class=r style="--c:#22d3ee;--d:-5s"></i>
    <i class=r style="--c:#ec4899;--d:-7s"></i>
  </div>
  <i class="exit" style="--c:#4ade80"></i>
</div>
<label for=go>RUSH HOUR</label>
</body>
</html>
