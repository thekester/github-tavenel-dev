<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A slot machine in pure CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="spin">
<div class="machine">
  <div class="reels">
    <div class="reel"><b>♦ ♣ ♥ 7 ★ ♠</b></div>
    <div class="reel"><b>★ ♠ ♣ ♥ 7 ♦</b></div>
    <div class="reel"><b>♦ ♣ ★ ♠ ♥ 7</b></div>
  </div>
  <label for="spin"></label>
</div>
</body>
</html>
