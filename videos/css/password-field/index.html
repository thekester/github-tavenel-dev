<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show password, zero JS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="show">
<div class="field">
  <input id="pw" placeholder="Password"
    pattern="(?=.*\d)(?=.*\W).{10,}">
  <label for="show" class="eye"></label>
  <i class="bar"></i>
</div>
<p class="meter"></p>
</body>
</html>
