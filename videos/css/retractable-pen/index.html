<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click pen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=c1>
<input type=checkbox id=c2>
<div class="scene">
  <div class="paper"><i class="ink"></i></div>
  <div class="pen">
    <div class="body">
      <i class="barrel"></i><i class="clip"></i>
      <b class="plunger"></b><b class="tip"></b>
    </div>
  </div>
  <label for=c1></label>
  <label for=c2></label>
</div>
</body>
</html>
