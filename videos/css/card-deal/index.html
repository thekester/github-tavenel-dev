<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card deal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="felt">
  <i class="deck"></i>
  <div class="card" style="--x:-145px;
    --y:-240px;--r:-8deg;--d:1.2s">
    <b class="f spade">A</b></div>
  <div class="card" style="--x:-55px;
    --y:-256px;--r:-3deg;--d:.8s">
    <b class="f heart">K</b></div>
  <div class="card" style="--x:55px;
    --y:-256px;--r:3deg;--d:.4s">
    <b class="f diamond">Q</b></div>
  <div class="card" style="--x:145px;
    --y:-240px;--r:8deg;--d:0s">
    <b class="f club">J</b></div>
</div>
<label for=go class="deal">Deal</label>
</body>
</html>
