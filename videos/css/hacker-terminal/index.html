<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A terminal that types itself</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="go">
<div class="term">
  <header>bash</header>
  <p style="--n:19;--d:0">$ ssh dev@mainframe</p>
  <p style="--n:13;--d:1.2">Connecting...</p>
  <p style="--n:18;--d:2.2">$ sudo make coffee</p>
  <p style="--n:18;--d:3.3">password: ********</p>
  <p style="--n:17;--d:4.4">[##########] 100%</p>
  <h2>ACCESS GRANTED</h2>
</div>
<label for="go"></label>
</body>
</html>
