<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS kitchen scale</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=ap>
<input type=checkbox id=fl>
<input type=checkbox id=eg>
<div class="scale">
  <i class="apple"></i>
  <i class="flour">FLOUR</i>
  <i class="egg"></i>
  <b class="plate"></b>
  <div class="dial"><b></b></div>
  <output></output>
</div>
<p>
  <label for=ap>Apple 150g</label>
  <label for=fl>Flour 500g</label>
  <label for=eg>Egg 60g</label>
</p>
</body>
</html>
