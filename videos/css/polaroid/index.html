<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant camera</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <label for=go class="shutter"></label>
  <div class="cam"><i class="lens"></i></div>
  <div class="slot">
    <div class="photo">
      <div class="pic"></div>
    </div>
  </div>
  <b class="flash"></b>
</div>
</body>
</html>
