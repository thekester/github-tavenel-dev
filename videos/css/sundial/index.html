<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS sundial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=radio name=t id=t9 checked>
<input type=radio name=t id=t12>
<input type=radio name=t id=t3>
<input type=radio name=t id=t6>
<div class="scene">
  <i class="sun"></i>
  <i class="ground"></i>
  <i class="post"></i>
  <div class="dial"><i class="shadow"></i></div>
  <i class="gnomon"></i>
</div>
<nav>
  <label for=t9>9 AM</label>
  <label for=t12>Noon</label>
  <label for=t3>3 PM</label>
  <label for=t6>6 PM</label>
</nav>
</body>
</html>
