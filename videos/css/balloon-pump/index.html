<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pump it up</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=p1>
<input type=checkbox id=p2>
<input type=checkbox id=p3>
<div class="scene">
  <div class="pump"><b class="handle"></b></div>
  <i class="hose"></i>
  <i class="shred"></i>
  <div class="balloon"></div>
  <div class="boom"></div>
  <div class="bits">
    <i style="--x:-110px;--y:-60px"></i>
    <i style="--x:-60px;--y:-120px"></i>
    <i style="--x:10px;--y:-140px"></i>
    <i style="--x:90px;--y:-100px"></i>
    <i style="--x:120px;--y:-20px"></i>
    <i style="--x:80px;--y:70px"></i>
    <i style="--x:-20px;--y:90px"></i>
    <i style="--x:-100px;--y:40px"></i>
  </div>
  <label for=p1>PUMP</label>
  <label for=p2>PUMP</label>
  <label for=p3>PUMP</label>
</div>
</body>
</html>
