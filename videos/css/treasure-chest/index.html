<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open the chest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=open>
<label for=open class="scene">
  <i class="rays"></i>
  <i class="base"></i>
  <i class="lid"></i>
  <i class="coin" style="--x:-120px;--d:.3s"></i>
  <i class="coin" style="--x:-60px;--d:.45s"></i>
  <i class="coin" style="--x:0px;--d:.35s"></i>
  <i class="coin" style="--x:60px;--d:.5s"></i>
  <i class="coin" style="--x:120px;--d:.4s"></i>
</label>
</body>
</html>
