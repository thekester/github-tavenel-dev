<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domino effect</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="row">
  <label for=go style="--d:0s"></label>
  <i style="--d:.12s"></i>
  <i style="--d:.24s"></i>
  <i style="--d:.36s"></i>
  <i style="--d:.48s"></i>
  <i style="--d:.60s"></i>
  <i style="--d:.72s"></i>
  <i style="--d:.84s"></i>
</div>
</body>
</html>
