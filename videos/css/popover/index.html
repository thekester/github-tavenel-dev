<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A popup with zero JavaScript</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button popovertarget="menu">
  Share
</button>

<div id="menu" popover>
  <h3>Share this</h3>
  <a>Copy link</a>
  <a>Send by email</a>
  <a>Post it</a>
</div>
</body>
</html>
