<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS piggy bank</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=c1>
<input type=checkbox id=c2>
<input type=checkbox id=c3>
<div class="scene">
  <label for=c1 style="--dx:105px"></label>
  <label for=c2 style="--dx:15px"></label>
  <label for=c3 style="--dx:-75px"></label>
  <div class="pig"><i class="slot"></i></div>
  <p class="total"></p>
</div>
</body>
</html>
