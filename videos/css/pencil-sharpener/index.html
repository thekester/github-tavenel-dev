<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharpen a pencil</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="pen"><i></i></div>
  <div class="box"></div>
  <b style="--x:-80px;--d:1.1s;--s:0.9"></b>
  <b style="--x:-30px;--d:1.6s;--s:1.1"></b>
  <b style="--x:20px;--d:2.2s;--s:0.8"></b>
  <b style="--x:-55px;--d:2.8s;--s:1.2"></b>
  <b style="--x:5px;--d:3.3s;--s:1"></b>
</div>
<label for=go>SHARPEN</label>
</body>
</html>
