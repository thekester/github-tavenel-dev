<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A vinyl player in pure CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="play">
<div class="player">
  <div class="deck">
    <i class="vinyl"></i>
    <i class="arm"></i>
  </div>
  <b>Lo-fi CSS</b>
  <span>tavenel.dev</span>
  <div class="eq">
    <i style="--d:.5s"></i><i style="--d:.7s"></i>
    <i style="--d:.4s"></i><i style="--d:.6s"></i>
    <i style="--d:.8s"></i>
  </div>
  <label for="play"></label>
</div>
</body>
</html>
