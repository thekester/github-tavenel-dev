<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spider drop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="room">
  <i class="web"></i>
  <div class="silk">
    <div class="spider">
      <b style="--w:96px;--t:6px;--d:0s"></b>
      <b style="--w:110px;--t:16px;--d:-.15s"></b>
      <b style="--w:110px;--t:28px;--d:-.3s"></b>
      <b style="--w:96px;--t:40px;--d:-.45s"></b>
    </div>
  </div>
</div>
<label for=go>DROP</label>
</body>
</html>
