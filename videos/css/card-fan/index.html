<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover to fan the cards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hand">
  <i data-v="A♠" style="--i:-2">♠</i>
  <i class="r" data-v="K♥" style="--i:-1">♥</i>
  <i data-v="Q♣" style="--i:0">♣</i>
  <i class="r" data-v="J♦" style="--i:1">♦</i>
  <i data-v="10♠" style="--i:2">♠</i>
</div>
</body>
</html>
