<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floppy disk save</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="pc"><div class="scr">
    <p class="rdy">A:\> READY</p>
    <p class="sav">SAVING</p>
    <p class="ok">SAVED!</p>
    <i class="bar"></i>
  </div></div>
  <div class="drive"></div>
  <div class="bay"><i class="disk"></i></div>
</div>
<label for=go class="btn">Save</label>
</body>
</html>
