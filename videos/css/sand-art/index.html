<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sand art bottle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=s1>
<input type=checkbox id=s2>
<input type=checkbox id=s3>
<div class="scene">
  <label for=s1 class="c1"></label>
  <label for=s2 class="c2"></label>
  <label for=s3 class="c3"></label>
  <i class="pour c1"></i>
  <i class="pour c2"></i>
  <i class="pour c3"></i>
  <div class="bottle">
    <div class="sand">
      <b class="c1"></b>
      <b class="c2"></b>
      <b class="c3"></b>
    </div>
  </div>
  <p class="count"></p>
</div>
</body>
</html>
