<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glowing jellyfish</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=lit>
<div class="sea">
  <label for=lit class="jelly">
    <div class="body">
      <div class="bell"></div>
      <i style="--x:28px;--d:0s"></i>
      <i style="--x:52px;--d:0.3s"></i>
      <i style="--x:76px;--d:0.6s"></i>
      <i style="--x:100px;--d:0.9s"></i>
      <i style="--x:124px;--d:1.2s"></i>
    </div>
  </label>
  <b style="--x:40px;--y:60px;--d:0s"></b>
  <b style="--x:300px;--y:90px;--d:0.5s"></b>
  <b style="--x:60px;--y:250px;--d:1s"></b>
  <b style="--x:290px;--y:300px;--d:0.2s"></b>
  <b style="--x:30px;--y:400px;--d:0.7s"></b>
  <b style="--x:320px;--y:420px;--d:1.2s"></b>
  <b style="--x:180px;--y:30px;--d:0.9s"></b>
  <b style="--x:250px;--y:200px;--d:0.4s"></b>
  <b style="--x:120px;--y:430px;--d:0.6s"></b>
</div>
</body>
</html>
