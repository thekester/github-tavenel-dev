<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crack the safe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="safe">
  <div class="gold">
    <i></i><i></i><i></i><i></i><i></i>
  </div>
  <div class="door">
    <div class="dial">
      <b style="--n:0">0</b>
      <b style="--n:10">10</b>
      <b style="--n:20">20</b>
      <b style="--n:30">30</b>
      <b style="--n:40">40</b>
      <b style="--n:50">50</b>
      <b style="--n:60">60</b>
      <b style="--n:70">70</b>
      <b style="--n:80">80</b>
      <b style="--n:90">90</b>
    </div>
    <b class="handle"></b>
  </div>
</div>
<label for=go>Unlock</label>
</body>
</html>
