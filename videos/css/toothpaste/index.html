<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Striped toothpaste</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="brush"></div>
  <i style="--x:125px;--d:0.36s;--r:18deg"></i>
  <i style="--x:147px;--d:0.64s;--r:-18deg"></i>
  <i style="--x:169px;--d:0.93s;--r:18deg"></i>
  <i style="--x:191px;--d:1.21s;--r:-18deg"></i>
  <i style="--x:213px;--d:1.49s;--r:18deg"></i>
  <i style="--x:235px;--d:1.77s;--r:-18deg"></i>
  <i style="--x:257px;--d:2.06s;--r:18deg"></i>
  <div class="tube"><b></b></div>
  <s style="left:105px;top:195px;--d:2.4s"></s>
  <s style="left:245px;top:180px;--d:2.6s"></s>
  <s style="left:292px;top:215px;--d:2.8s"></s>
  <s style="left:170px;top:170px;--d:3.0s"></s>
</div>
<label for=go>Squeeze</label>
</body>
</html>
