<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Always north</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=radio name=h id=n checked>
<input type=radio name=h id=e>
<input type=radio name=h id=s>
<input type=radio name=h id=w>
<div class="compass">
  <div class="dial">
    <b style="--a:0deg">N</b>
    <b style="--a:90deg">E</b>
    <b style="--a:180deg">S</b>
    <b style="--a:270deg">W</b>
    <i class="needle"></i>
  </div>
</div>
<p class="deg"></p>
<div class="bar">
  <label for=n>N</label>
  <label for=e>E</label>
  <label for=s>S</label>
  <label for=w>W</label>
</div>
</body>
</html>
