<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A cube that unfolds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="t">
<label for="t" class="cube">
  <i style="--h:0;--z:1">1</i>
  <i style="--h:1;--x:1;--ry:1;--ux:1">2</i>
  <i style="--h:2;--z:-1;--ry:2;--ux:2">3</i>
  <i style="--h:3;--x:-1;--ry:-1;--ux:-1">4</i>
  <i style="--h:4;--y:-1;--rx:1;--uy:-1">5</i>
  <i style="--h:5;--y:1;--rx:-1;--uy:1">6</i>
</label>
</body>
</html>
