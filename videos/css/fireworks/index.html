<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fireworks in pure CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="fire">
<label for="fire" class="sky">
  <i style="--x:18%;--h:250px;--c:#f472b6;
     --d:0s;font-size:70px"></i>
  <i style="--x:72%;--h:300px;--c:#facc15;
     --d:.4s;font-size:90px"></i>
  <i style="--x:45%;--h:220px;--c:#38bdf8;
     --d:.9s;font-size:80px"></i>
  <i style="--x:85%;--h:200px;--c:#4ade80;
     --d:1.3s;font-size:60px"></i>
  <i style="--x:30%;--h:320px;--c:#c084fc;
     --d:1.7s;font-size:95px"></i>
  <i style="--x:60%;--h:270px;--c:#fb923c;
     --d:2.1s;font-size:75px"></i>
</label>
</body>
</html>
