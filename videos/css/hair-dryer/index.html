<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hair dryer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <label for=go class="dryer"><b></b></label>
  <s style="--y:128px;--d:0s"></s>
  <s style="--y:146px;--d:0.25s"></s>
  <s style="--y:164px;--d:0.1s"></s>
  <s style="--y:182px;--d:0.38s"></s>
  <div class="hair">
    <i style="--x:-16px;--h:190px;--d:.0s"></i>
    <i style="--x:4px;--h:200px;--d:.06s"></i>
    <i style="--x:24px;--h:175px;--d:.12s"></i>
    <i style="--x:46px;--h:160px;--d:.18s"></i>
    <i style="--x:68px;--h:165px;--d:.24s"></i>
    <i style="--x:88px;--h:180px;--d:.3s"></i>
    <i style="--x:108px;--h:205px;--d:.36s"></i>
    <i style="--x:126px;--h:185px;--d:.42s"></i>
  </div>
  <div class="head"></div>
</div>
</body>
</html>
