<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemon squeeze</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="stream"></div>
  <div class="glass">
    <i style="--x:18px;--d:0s"></i>
    <i style="--x:70px;--d:-.6s"></i>
  </div>
  <div class="seed"></div>
  <div class="lemon"></div>
  <div class="grid"></div>
  <div class="press"></div>
</div>
<label for=go class="btn">Squeeze</label>
</body>
</html>
