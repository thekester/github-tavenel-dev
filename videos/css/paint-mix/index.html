<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixing paint in CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=r>
<input type=checkbox id=y>
<input type=checkbox id=b>
<p>
  <label for=r style=--p:#e12;--t:35deg></label>
  <label for=y style=--p:#fc1;--t:0deg></label>
  <label for=b style=--p:#069;--t:-35deg></label>
</p>
<div class="bowl"><i></i></div>
<h2></h2>
</body>
</html>
