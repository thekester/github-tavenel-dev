<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asking CSS to center a div</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="go">
<div class="phone">
  <header><i>{}</i> CSS</header>
  <div class="chat">
    <p class="me" style="--d:0">
      Hey CSS, can you center a div?
    </p>
    <p class="css" style="--d:1.6">
      Easy.
    </p>
    <p class="css code" style="--d:3.0">
      display: grid;<br>place-items: center;
    </p>
    <p class="me" style="--d:4.4">
      ...that's it??
    </p>
    <p class="css" style="--d:5.8">
      That's it.
    </p>
    <p class="me" style="--d:7.0">
      I spent 3 hours on this
    </p>
  </div>
  <label for="go">Start chat</label>
</div>
</body>
</html>
