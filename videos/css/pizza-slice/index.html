<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull a pizza slice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="pizza">
    <b class="hole"></b>
    <i style="--x:187px;--y:133px"></i>
    <i style="--x:224px;--y:118px"></i>
    <i style="--x:256px;--y:105px"></i>
    <i style="--x:187px;--y:163px"></i>
    <i style="--x:224px;--y:178px"></i>
    <i style="--x:256px;--y:191px"></i>
    <div class="slice"></div>
  </div>
  <s style="--d:0s"></s>
  <s style="--d:.7s"></s>
  <s style="--d:1.4s"></s>
  <label for=go></label>
</div>
</body>
</html>
