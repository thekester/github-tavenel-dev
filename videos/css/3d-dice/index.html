<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll a 3D dice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="dice">
    <i class="f1"></i><i class="f2"></i>
    <i class="f3"></i><i class="f4"></i>
    <i class="f5"></i><i class="f6"></i>
  </div>
  <div class="shadow"></div>
</div>
<label for=go class="roll">Roll</label>
</body>
</html>
