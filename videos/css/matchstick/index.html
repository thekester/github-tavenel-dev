<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike a match</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=lit>
<div class="scene">
  <div class="match">
    <div class="stick">
      <i class="flame"></i>
      <i class="smoke" style="--d:0s"></i>
      <i class="smoke" style="--d:.5s"></i>
      <i class="smoke" style="--d:1s"></i>
    </div>
  </div>
  <div class="box"><label for=lit></label></div>
</div>
</body>
</html>
