<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS accordion</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="acc">
  <div class="bass"></div>
  <div class="bel"></div>
  <div class="keys">
    <i style="--d:0s"></i><i style="--d:.2s"></i>
    <i style="--d:.4s"></i><i style="--d:.6s"></i>
    <i style="--d:.8s"></i><i style="--d:1s"></i>
    <i style="--d:1.2s"></i>
  </div>
  <b style="--x:-60px;--d:0s;--c:#fde047"></b>
  <b style="--x:40px;--d:.6s;--c:#f472b6"></b>
  <b style="--x:-20px;--d:1.2s;--c:#4ade80"></b>
  <b style="--x:70px;--d:1.8s;--c:#38bdf8"></b>
</div>
<label for=go>PLAY</label>
</body>
</html>
