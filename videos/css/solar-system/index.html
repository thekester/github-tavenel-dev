<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hover the sun to stop time</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sun"></div>
<div class="orbit" style="--r:80;--t:3">
  <i style="--s:11;--c:#b8aa98"></i>
</div>
<div class="orbit" style="--r:125;--t:5">
  <i style="--s:17;--c:#e8a55a"></i>
</div>
<div class="orbit" style="--r:175;--t:8">
  <i style="--s:20;--c:#4f9df0"><b></b></i>
</div>
<div class="orbit" style="--r:225;--t:12">
  <i style="--s:16;--c:#e0573b"></i>
</div>
<div class="orbit" style="--r:290;--t:18">
  <i style="--s:32;--c:#e3c88f"></i>
</div>
</body>
</html>
