<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS bubble tea</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=add>
<input type=checkbox id=sip>
<div class="scene">
  <label for=sip class="straw"></label>
  <b class="lid"></b>
  <div class="cup">
    <div class="tea"></div>
    <i style="--x:28px;--y:4px;--d:.6s"></i>
    <i style="--x:53px;--y:4px;--d:0s"></i>
    <i style="--x:78px;--y:4px;--d:1.2s"></i>
    <i style="--x:103px;--y:4px;--d:.4s"></i>
    <i style="--x:128px;--y:4px;--d:1s"></i>
    <i style="--x:152px;--y:4px;--d:.2s"></i>
    <i style="--x:40px;--y:22px;--d:1.6s"></i>
    <i style="--x:65px;--y:22px;--d:1.4s"></i>
    <i style="--x:90px;--y:22px;--d:2s"></i>
    <i style="--x:115px;--y:22px;--d:1.8s"></i>
    <i style="--x:140px;--y:22px;--d:2.2s"></i>
  </div>
</div>
<label for=add class="btn">Add pearls</label>
</body>
</html>
