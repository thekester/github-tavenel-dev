<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS moon phases</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="moon"></div>
<div class="dots">
  <input type=radio name=p id=p0 checked>
  <label for=p0 data-n="New moon"></label>
  <input type=radio name=p id=p1>
  <label for=p1 data-n="Waxing crescent"></label>
  <input type=radio name=p id=p2>
  <label for=p2 data-n="First quarter"></label>
  <input type=radio name=p id=p3>
  <label for=p3 data-n="Waxing gibbous"></label>
  <input type=radio name=p id=p4>
  <label for=p4 data-n="Full moon"></label>
  <input type=radio name=p id=p5>
  <label for=p5 data-n="Waning gibbous"></label>
  <input type=radio name=p id=p6>
  <label for=p6 data-n="Last quarter"></label>
  <input type=radio name=p id=p7>
  <label for=p7 data-n="Waning crescent"></label>
</div>
</body>
</html>
