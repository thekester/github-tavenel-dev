<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stack the scoops</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=s1>
<input type=checkbox id=s2>
<input type=checkbox id=s3>
<input type=checkbox id=s4>
<div class="scene">
  <p class="count"></p>
  <div class="stack">
    <i class="k1" style="--c:#f9a8d4"></i>
    <i class="k2" style="--c:#86efac"></i>
    <i class="k3" style="--c:#92400e"></i>
    <i class="k4" style="--c:#fde047"></i>
  </div>
  <b class="cone"></b>
</div>
<div class="btns">
  <label for=s1 style="--c:#f9a8d4">Berry</label>
  <label for=s2 style="--c:#86efac">Mint</label>
  <label for=s3 style="--c:#92400e">Choco</label>
  <label for=s4 style="--c:#fde047">Lemon</label>
</div>
</body>
</html>
