<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS beehive</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <label for=go class="hive">
    <b></b><b></b><b></b><b></b><b></b>
  </label>
  <u style="--x:-40px;--d:0s"></u>
  <u style="--x:6px;--d:.7s"></u>
  <u style="--x:44px;--d:.35s"></u>
  <div class="swarm">
    <i style="--d:0s"></i>
    <i style="--d:-1s"></i>
    <i style="--d:-2s"></i>
    <i class="new" style="--d:0s"></i>
    <i class="new" style="--d:.4s"></i>
    <i class="new" style="--d:.8s"></i>
    <i class="new" style="--d:1.2s"></i>
  </div>
</div>
</body>
</html>
