<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarm clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=wait>
<input type=checkbox id=snz>
<div class="scene">
  <p class="ring">RING RING!</p>
  <div class="clock">
    <b></b>
    <i class="l"></i><i class="r"></i>
    <div class="face"><span></span></div>
  </div>
  <p class="zzz">Z<small>Z</small><sub>Z</sub></p>
</div>
<label for=wait>Wait</label>
<label for=snz>Snooze</label>
</body>
</html>
