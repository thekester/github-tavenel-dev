<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect four</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game">
  <input type=checkbox id=m1>
  <label for=m1 style=--c:2;--r:0></label>
  <input type=checkbox id=m2>
  <label for=m2 class=y style=--c:2;--r:1></label>
  <input type=checkbox id=m3>
  <label for=m3 style=--c:3;--r:0></label>
  <input type=checkbox id=m4>
  <label for=m4 class=y style=--c:3;--r:1></label>
  <input type=checkbox id=m5>
  <label for=m5 style=--c:4;--r:0></label>
  <input type=checkbox id=m6>
  <label for=m6 class=y style=--c:6;--r:0></label>
  <input type=checkbox id=m7>
  <label for=m7 style=--c:5;--r:0></label>
  <div class="board"></div>
  <p class="msg">Red wins!</p>
</div>
</body>
</html>
