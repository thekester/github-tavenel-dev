<html lang="en">
<head>

<title>CSS magnet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div class="table"></div>
  <div class="magnet"></div>
  <i style="--x:60px;--y:330px;--r:70deg;
    --tx:148px;--ty:158px;--d:0s;--c:#6af"></i>
  <i style="--x:300px;--y:290px;--r:-40deg;
    --tx:238px;--ty:158px;--d:.35s;--c:#fc1"></i>
  <i style="--x:180px;--y:375px;--r:20deg;
    --tx:148px;--ty:194px;--d:.7s;--c:#4d8"></i>
  <i style="--x:95px;--y:272px;--r:-110deg;
    --tx:238px;--ty:194px;--d:1.05s;--c:#f7b"></i>
  <i style="--x:320px;--y:375px;--r:100deg;
    --tx:148px;--ty:230px;--d:1.4s;--c:#eee"></i>
</div>
</body>
</html>
