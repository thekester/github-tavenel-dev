<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The knight move</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="board">
  <i style="--c:4;--r:6;--d:.00s"></i>
  <i style="--c:2;--r:6;--d:.08s"></i>
  <i style="--c:1;--r:5;--d:.16s"></i>
  <i style="--c:1;--r:3;--d:.24s"></i>
  <i style="--c:2;--r:2;--d:.32s"></i>
  <i style="--c:4;--r:2;--d:.40s"></i>
  <i style="--c:5;--r:3;--d:.48s"></i>
  <i style="--c:5;--r:5;--d:.56s"></i>
  <b class="knight"></b>
  <label for=go></label>
</div>
</body>
</html>
