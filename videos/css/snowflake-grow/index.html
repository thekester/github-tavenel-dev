<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow a snowflake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="sky">
  <div class="flake">
  <p style="--a:0deg"><i></i><i></i><i></i></p>
  <p style="--a:60deg"><i></i><i></i><i></i></p>
  <p style="--a:120deg"><i></i><i></i><i></i></p>
  <p style="--a:180deg"><i></i><i></i><i></i></p>
  <p style="--a:240deg"><i></i><i></i><i></i></p>
  <p style="--a:300deg"><i></i><i></i><i></i></p>
  </div>
  <b style="top:22%;left:24%;--d:2.2s"></b>
  <b style="top:70%;left:78%;--d:2.6s"></b>
  <b style="top:30%;left:80%;--d:3s"></b>
  <b style="top:76%;left:18%;--d:3.4s"></b>
</div>
<label for=go>FREEZE</label>
</body>
</html>
