<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Morse lamp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="lamp"><i class="lens"></i></div>
  <div class="post"></div>
  <p class="word">
    <b style="--t:0;--n:5" data-m="• • •">S</b>
    <b style="--t:8;--n:11" data-m="— — —">O</b>
    <b style="--t:22;--n:5" data-m="• • •">S</b>
  </p>
  <label for=go>Send</label>
</div>
</body>
</html>
