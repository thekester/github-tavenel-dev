<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar scan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="radar">
  <b class="sweep"></b>
  <i style="--a:40deg;--r:90px;--d:2.83s"></i>
  <i style="--a:130deg;--r:120px;--d:.58s"></i>
  <i style="--a:215deg;--r:60px;--d:1.29s"></i>
  <i style="--a:300deg;--r:135px;--d:2.00s"></i>
</div>
<label for=go class="scan">SCAN</label>
</body>
</html>
