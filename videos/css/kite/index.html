<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windy kite</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=radio name=w id=calm checked>
<input type=radio name=w id=windy>
<div class="sky">
  <i class="cloud" style="--y:40px;--d:-4s"></i>
  <i class="cloud" style="--y:150px;--d:-13s"></i>
  <div class="rig">
    <div class="kite">
      <div class="tail">
        <b></b><b></b><b></b>
      </div>
    </div>
  </div>
</div>
<nav>
  <label for=calm>Calm</label>
  <label for=windy>Windy</label>
</nav>
</body>
</html>
