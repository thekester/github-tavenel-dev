<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro fridge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=open>
<div class="fridge">
  <div class="inside">
    <i class="milk"></i><i class="apple"></i>
    <i class="cheese"></i><i class="jar"></i>
  </div>
  <div class="door"></div>
  <s style="--d:.6s"></s>
  <s style="--d:1.4s"></s>
  <s style="--d:2.2s"></s>
  <label for=open class="handle"></label>
</div>
</body>
</html>
