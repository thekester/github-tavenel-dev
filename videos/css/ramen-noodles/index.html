<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramen slurp</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <b style="--x:90px;--d:0s"></b>
  <b style="--x:170px;--d:.8s"></b>
  <b style="--x:250px;--d:1.6s"></b>
  <div class="nori"></div>
  <div class="broth"></div>
  <div class="noodles"></div>
  <div class="egg"></div>
  <div class="sticks"></div>
  <i style="--d:3.3s"></i>
  <i style="--d:3.8s;--x:24px"></i>
  <div class="bowl"></div>
</div>
<label for=go class="btn">Slurp</label>
</body>
</html>
