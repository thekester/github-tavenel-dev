<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A 3D carousel in pure CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="ring">
    <i style="--i:0">Ideas</i>
    <i style="--i:1">Design</i>
    <i style="--i:2">Code</i>
    <i style="--i:3">Test</i>
    <i style="--i:4">Ship</i>
    <i style="--i:5">Repeat</i>
  </div>
</div>
<nav>
  <label><input type="radio" name="s" id="s0"></label>
  <label><input type="radio" name="s" id="s1"></label>
  <label><input type="radio" name="s" id="s2"></label>
  <label><input type="radio" name="s" id="s3"></label>
  <label><input type="radio" name="s" id="s4"></label>
  <label><input type="radio" name="s" id="s5"></label>
</nav>
</body>
</html>
