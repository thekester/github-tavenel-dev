<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whistling kettle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="stove">
  <div class="kettle">
    <i class="lid"></i>
    <i class="spout"></i>
    <i class="window">
      <b style="--x:8px;--d:.5s"></b>
      <b style="--x:30px;--d:.8s"></b>
      <b style="--x:18px;--d:1.1s"></b>
    </i>
    <s style="--d:1.4s"></s>
    <s style="--d:1.8s"></s>
    <s style="--d:2.2s"></s>
    <i class="jet"></i>
  </div>
  <i class="flame"></i>
  <p class="whee">WHEEE</p>
</div>
<label for=go>BOIL</label>
</body>
</html>
