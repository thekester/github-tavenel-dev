<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A memory game in pure CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game">
  <p class="msg"></p>
  <label class="card a">
    <input type="checkbox" id="a1"><i>♥</i>
  </label>
  <label class="card c">
    <input type="checkbox" id="c1"><i>♦</i>
  </label>
  <label class="card b">
    <input type="checkbox" id="b1"><i>♠</i>
  </label>
  <label class="card d">
    <input type="checkbox" id="d2"><i>♣</i>
  </label>
  <label class="card b">
    <input type="checkbox" id="b2"><i>♠</i>
  </label>
  <label class="card a">
    <input type="checkbox" id="a2"><i>♥</i>
  </label>
  <label class="card d">
    <input type="checkbox" id="d1"><i>♣</i>
  </label>
  <label class="card c">
    <input type="checkbox" id="c2"><i>♦</i>
  </label>
</div>
</body>
</html>
