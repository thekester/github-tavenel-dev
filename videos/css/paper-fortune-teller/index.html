<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper fortune teller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="teller">
  <p class="fortune">Your code compiles
    first try</p>
  <i style="--sx:-1;--sy:-1;--g:45deg;
    --c:#f472b6"></i>
  <i class="tr" style="--sx:1;--sy:-1;--g:-45deg;
    --c:#facc15"></i>
  <i style="--sx:-1;--sy:1;--g:-45deg;
    --c:#22d3ee"></i>
  <i style="--sx:1;--sy:1;--g:45deg;
    --c:#a3e635"></i>
</div>
<label for=go>PLAY</label>
</body>
</html>
