<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submarine dive</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="sea">
  <div class="sub"><b class="peri"></b></div>
  <u style="--x:0px;--d:.6s"></u>
  <u style="--x:14px;--d:1s"></u>
  <u style="--x:-8px;--d:1.4s"></u>
  <u style="--x:6px;--d:1.8s"></u>
  <i class="fish"></i>
  <p class="depth"></p>
</div>
<label for=go>Dive</label>
</body>
</html>
