<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typing keyboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="desk">
  <div class="screen">
    <input id=t placeholder="click me">
  </div>
  <div class="kb">
    <p><i>Q</i><i>W</i><i style="--d:.9s">E</i>
      <i>R</i><i>T</i><i>Y</i><i>U</i><i>I</i>
      <i style="--d:1.8s">O</i><i>P</i></p>
    <p><i>A</i><i style="--d:2.7s;--n:2">S</i>
      <i>D</i><i>F</i><i>G</i>
      <i style="--d:.6s">H</i><i>J</i><i>K</i>
      <i style="--d:1.2s;--n:2">L</i></p>
    <p><i>Z</i><i>X</i><i style="--d:2.4s">C</i>
      <i>V</i><i>B</i><i>N</i><i>M</i></p>
    <p><i class="sp" style="--d:2.1s"></i></p>
  </div>
</div>
</body>
</html>
