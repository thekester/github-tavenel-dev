<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steep some tea</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="bag"></div>
  <div class="mug">
    <div class="water"><i class="tea"></i></div>
  </div>
  <i class="steam" style="--x:110px;--d:0s"></i>
  <i class="steam" style="--x:150px;--d:.8s"></i>
  <i class="steam" style="--x:190px;--d:1.6s"></i>
</div>
<label for=go class="btn">Steep</label>
</body>
</html>
