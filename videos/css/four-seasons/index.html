<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four seasons in pure CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <i class="sun"></i>
  <i class="trunk"></i>
  <i class="leaves"></i>
  <i class="fall"></i>
</div>
<nav>
  <label>
    <input type="radio" name="s" id="s0" checked>Spring
  </label>
  <label>
    <input type="radio" name="s" id="s1">Summer
  </label>
  <label>
    <input type="radio" name="s" id="s2">Autumn
  </label>
  <label>
    <input type="radio" name="s" id="s3">Winter
  </label>
</nav>
</body>
</html>
