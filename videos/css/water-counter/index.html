<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numbers that count up in CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <p class="ml"></p>
  <div class="glass"><i class="water"></i></div>
  <nav>
    <label>
      <input type="radio" name="w" id="l0" checked>
      0
    </label>
    <label>
      <input type="radio" name="w" id="l1">
      250
    </label>
    <label>
      <input type="radio" name="w" id="l2">
      500
    </label>
    <label>
      <input type="radio" name="w" id="l3">
      750
    </label>
    <label>
      <input type="radio" name="w" id="l4">
      1000
    </label>
  </nav>
</div>
</body>
</html>
