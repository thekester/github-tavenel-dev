<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride a CSS bike</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <b class="hills"></b>
  <b class="trees"></b>
  <b class="road"></b>
  <div class="bike">
    <b class="wheel" style="--x:125"></b>
    <b class="wheel" style="--x:305"></b>
    <b class="chain"></b>
  <i style="--x:125;--y:205;--l:80;--a:4"></i>
  <i style="--x:125;--y:205;--l:96;--a:-51"></i>
  <i style="--x:205;--y:210;--l:82;--a:-104"></i>
  <i style="--x:185;--y:130;--l:102;--a:-1"></i>
  <i style="--x:205;--y:210;--l:104;--a:-41"></i>
  <i style="--x:287;--y:128;--l:79;--a:77"></i>
  <i style="--x:287;--y:128;--l:23;--a:-103"></i>
    <b class="crank"></b>
  </div>
</div>
<label for=go class="ride">Ride</label>
</body>
</html>
