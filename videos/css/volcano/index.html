<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make it erupt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="rocks">
    <i style="--x:-120px;--h:-160px;--d:0s"></i>
    <i style="--x:-60px;--h:-220px;--d:.15s"></i>
    <i style="--x:-20px;--h:-260px;--d:.3s"></i>
    <i style="--x:40px;--h:-240px;--d:.1s"></i>
    <i style="--x:90px;--h:-190px;--d:.25s"></i>
    <i style="--x:140px;--h:-150px;--d:.4s"></i>
  </div>
  <div class="smoke"><i></i><i></i><i></i></div>
  <label for=go class="volcano">
    <i class="lava"></i>
  </label>
</div>
</body>
</html>
