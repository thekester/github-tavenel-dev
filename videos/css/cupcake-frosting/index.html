<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost a cupcake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <i class="liner"></i>
  <i class="cake"></i>
  <b style="--w:186px;--t:246px;--d:.30s"></b>
  <b style="--w:156px;--t:216px;--d:.85s"></b>
  <b style="--w:124px;--t:188px;--d:1.40s"></b>
  <b style="--w:94px;--t:162px;--d:1.95s"></b>
  <b style="--w:64px;--t:138px;--d:2.50s"></b>
  <b style="--w:34px;--t:116px;--d:3.05s"></b>
  <i class="cherry"></i>
  <div class="path"><i class="bag"></i></div>
</div>
<label for=go class="btn">Frost</label>
</body>
</html>
