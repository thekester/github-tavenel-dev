<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS maze solver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="maze">
  <i style="--x:0;--y:1;--w:3"></i>
  <i style="--x:4;--y:0;--h:3"></i>
  <i style="--x:1;--y:2;--w:2"></i>
  <i style="--x:1;--y:1;--h:3"></i>
  <i style="--x:2;--y:3;--w:2"></i>
  <i style="--x:2;--y:3;--h:1"></i>
  <i style="--x:3;--y:4;--w:1"></i>
  <i style="--x:3;--y:1;--h:1"></i>
  <b style="--x:0;--y:0;--w:3;--d:0s"></b>
  <b style="--x:3;--y:0;--h:2;--d:.75s;
    --s:1 0"></b>
  <b style="--x:1;--y:2;--w:2;--d:1.25s;
    --o:right"></b>
  <b style="--x:1;--y:2;--h:2;--d:1.75s;
    --s:1 0"></b>
  <b style="--x:1;--y:4;--w:3;--d:2.25s"></b>
  <u class="runner"></u>
  <s class="flag"></s>
</div>
<label for=go>SOLVE</label>
</body>
</html>
