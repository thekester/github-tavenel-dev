<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble wand</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div class="wand"></div>
  <i style="--s:70px;--x:-30px;--y:-190px;
     --w:40px;--t:3.2s;--d:0s"></i>
  <i style="--s:44px;--x:80px;--y:-150px;
     --w:-30px;--t:2.6s;--d:0.4s"></i>
  <i style="--s:84px;--x:-100px;--y:-150px;
     --w:50px;--t:3.6s;--d:0.9s"></i>
  <i style="--s:36px;--x:120px;--y:-200px;
     --w:20px;--t:2.4s;--d:1.3s"></i>
  <i style="--s:58px;--x:30px;--y:-120px;
     --w:-40px;--t:2.9s;--d:1.7s"></i>
  <i style="--s:50px;--x:-130px;--y:-80px;
     --w:30px;--t:3.1s;--d:2.1s"></i>
  <i style="--s:76px;--x:120px;--y:-70px;
     --w:-30px;--t:3.4s;--d:0.2s"></i>
</div>
</body>
</html>
