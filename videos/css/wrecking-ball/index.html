<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrecking ball</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <b class="mast"></b><b class="boom"></b>
  <div class="arm"><b class="ball"></b></div>
  <div class="wall">
  <i style="--x:40;--y:-80;--e:112;--r:360"></i>
  <i style="--x:80;--y:-95;--e:112;--r:-180"></i>
  <i style="--x:115;--y:-70;--e:112;--r:540"></i>
  <i style="--x:30;--y:-60;--e:84;--r:-180"></i>
  <i style="--x:65;--y:-75;--e:84;--r:360"></i>
  <i style="--x:100;--y:-50;--e:84;--r:180"></i>
  <i style="--x:20;--y:-45;--e:56;--r:180"></i>
  <i style="--x:50;--y:-55;--e:56;--r:-360"></i>
  <i style="--x:85;--y:-35;--e:56;--r:180"></i>
  <i style="--x:14;--y:-25;--e:28;--r:180"></i>
  <i></i>
  <i></i>
  <i></i>
  <i></i>
  <i></i>
  </div>
  <s style="--dx:-10px"></s>
  <s style="--dx:20px"></s>
</div>
<label for=go class="btn">Swing</label>
</body>
</html>
