<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS waterfall</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <b class="cliff"></b>
  <b class="fall"></b>
  <b class="rainbow"></b>
  <b class="fish"></b>
  <b class="pool"></b>
  <i style="--x:120px;--d:0s"></i>
  <i style="--x:160px;--d:-.4s"></i>
  <i style="--x:200px;--d:-.8s"></i>
  <i style="--x:140px;--d:-1.1s"></i>
  <i style="--x:185px;--d:-.6s"></i>
  <b class="mist"></b>
</div>
<label for=go>Rainbow</label>
</body>
</html>
