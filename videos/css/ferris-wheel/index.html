<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferris wheel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="park">
  <div class="legs"></div>
  <div class="wheel">
    <i style="--a:0deg;--c:#ef4444"><b></b></i>
    <i style="--a:45deg;--c:#f97316"><b></b></i>
    <i style="--a:90deg;--c:#eab308"><b></b></i>
    <i style="--a:135deg;--c:#22c55e"><b></b></i>
    <i style="--a:180deg;--c:#06b6d4"><b></b></i>
    <i style="--a:225deg;--c:#3b82f6"><b></b></i>
    <i style="--a:270deg;--c:#8b5cf6"><b></b></i>
    <i style="--a:315deg;--c:#ec4899"><b></b></i>
  </div>
</div>
<label for=go class="ride">Ride</label>
</body>
</html>
