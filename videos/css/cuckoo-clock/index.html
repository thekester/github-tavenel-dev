<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS cuckoo clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="clock">
  <div class="roof"></div>
  <div class="house">
    <div class="door"><i class="bird"></i></div>
    <label for=go class="face">
      <i class="hr"></i><i class="min"></i>
    </label>
  </div>
  <div class="pendulum"></div>
</div>
</body>
</html>
