<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS trumpet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="tr">
  <i class="loop"></i>
  <i class="tube"></i>
  <i class="v" style="--d:0s;left:140px"></i>
  <i class="v" style="--d:.3s;left:176px"></i>
  <i class="v" style="--d:.6s;left:212px"></i>
  <i class="bell"></i>
  <b style="--c:#f472b6;--d:0s"></b>
  <b style="--c:#38bdf8;--d:.4s"></b>
  <b style="--c:#a3e635;--d:.8s"></b>
  <b style="--c:#fb923c;--d:1.2s"></b>
  <b style="--c:#c084fc;--d:1.6s"></b>
  <label for=go class="mp"></label>
</div>
</body>
</html>
