<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="map">
  <b class="line"></b>
  <i style="--x:40;--y:75;--t:0.00s">
    Harbor</i>
  <i style="--x:140;--y:75;--t:1.11s">
    Market</i>
  <i style="--x:240;--y:75;--t:2.22s">
    Museum</i>
  <i class=v style="--x:315;--y:160;--t:3.79s">
    Park</i>
  <i class=v style="--x:315;--y:260;--t:4.90s">
    Stadium</i>
  <i class=v style="--x:315;--y:360;--t:6.01s">
    Airport</i>
  <b class="train"></b>
  <p class="next"></p>
</div>
<label for=go>Depart</label>
</body>
</html>
