<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS thermometer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div class="tube"><i class="bulb"></i></div>
  <div class="side">
    <i class="icon"></i>
    <p class="temp"></p>
  </div>
</div>
<div class="btns">
  <label><input type=radio name=s id=winter>
    Winter</label>
  <label><input type=radio name=s id=spring
    checked>Spring</label>
  <label><input type=radio name=s id=summer>
    Summer</label>
</div>
</body>
</html>
