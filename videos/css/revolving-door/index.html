<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revolving door</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="stage">
    <b class="room"></b>
    <b class="wall"></b>
    <b class="floor"></b>
    <div class="rotor">
      <i style="--a:45deg"></i>
      <i style="--a:135deg"></i>
      <i style="--a:225deg"></i>
      <i style="--a:315deg"></i>
    </div>
    <b class="guy"></b>
  </div>
</div>
<label for=go class="btn">Enter</label>
</body>
</html>
