<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS origami</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="paper">
  <i class="base"></i>
  <i style="--o:25% 25%;--ax:-1,1;--d:0s;
    --cp:0 0,50% 0,0 50%"></i>
  <i style="--o:75% 25%;--ax:-1,-1;--d:.8s;
    --cp:50% 0,100% 0,100% 50%"></i>
  <i style="--o:75% 75%;--ax:1,-1;--d:1.6s;
    --cp:100% 50%,100% 100%,50% 100%"></i>
  <i style="--o:25% 75%;--ax:1,1;--d:2.4s;
    --cp:0 50%,0 100%,50% 100%"></i>
  <b class="seal">&hearts;</b>
</div>
<label for=go>Fold</label>
</body>
</html>
