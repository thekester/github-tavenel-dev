<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed the black hole</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="bh">
  <div class="disk"></div>
  <div class="lens"></div>
  <div class="hole"></div>
  <div class="disk front"></div>
  <div class="feed">
    <i style="--a:0deg;--d:0s"><b></b></i>
    <i style="--a:140deg;--d:.4s"><b></b></i>
    <i style="--a:250deg;--d:.8s"><b></b></i>
    <i style="--a:60deg;--d:1.2s"><b></b></i>
    <i style="--a:200deg;--d:1.6s"><b></b></i>
    <i style="--a:320deg;--d:2s"><b></b></i>
  </div>
</div>
<label for=go>Feed</label>
</body>
</html>
