<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A to-do list that counts itself</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="todo">
  <label>
    <input type="checkbox" id="a"> Write the HTML
  </label>
  <label>
    <input type="checkbox" id="b"> Style it with CSS
  </label>
  <label>
    <input type="checkbox" id="c"> Record the short
  </label>
  <label>
    <input type="checkbox" id="d"> Post it
  </label>
  <label>
    <input type="checkbox" id="e"> Touch grass
  </label>
  <p class="count"></p>
</div>
</body>
</html>
