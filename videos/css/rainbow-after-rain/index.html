<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After the rain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=sun>
<div class="sky">
  <div class="rainbow">
    <i style="--c:#ef4444;--s:0px;--d:1.20s"></i>
    <i style="--c:#f97316;--s:12px;--d:1.38s"></i>
    <i style="--c:#facc15;--s:24px;--d:1.56s"></i>
    <i style="--c:#22c55e;--s:36px;--d:1.74s"></i>
    <i style="--c:#3b82f6;--s:48px;--d:1.92s"></i>
    <i style="--c:#8b5cf6;--s:60px;--d:2.10s"></i>
  </div>
  <b class="sunny"></b>
  <b class="rain"></b>
  <b class="cloud"></b>
  <b class="cloud two"></b>
</div>
<label for=sun class="btn">Sun</label>
</body>
</html>
