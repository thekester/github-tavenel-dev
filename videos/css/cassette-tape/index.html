<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cassette tape</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="tape">
  <div class="win">
    <i class="reel l"></i><i class="reel r"></i>
  </div>
</div>
<div class="vu">
  <i style="--s:.31s"></i><i style="--s:.47s"></i>
  <i style="--s:.23s"></i><i style="--s:.39s"></i>
  <i style="--s:.29s"></i><i style="--s:.53s"></i>
  <i style="--s:.35s"></i>
</div>
<label for=go class="btn">Play</label>
</body>
</html>
