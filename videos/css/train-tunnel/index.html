<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tunnel train</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <b class="mount"></b>
  <b class="hole"></b><b class="hole r"></b>
  <div class="train">
    <i class="car eng" style="--d:0s">
      <s></s><s style="--p:.5s"></s>
    </i>
    <i class="car" style="--d:.5s;--c:#38bdf8">
    </i>
    <i class="car" style="--d:1s;--c:#a3e635">
    </i>
    <i class="car" style="--d:1.5s;--c:#facc15">
    </i>
  </div>
</div>
<label for=go class="btn">Depart</label>
</body>
</html>
