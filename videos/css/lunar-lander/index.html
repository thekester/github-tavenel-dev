<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moon landing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <i class="earth"></i>
  <i class="ground"></i>
  <i class="dust" style="--x:-40px;left:80px"></i>
  <i class="dust" style="--x:40px;left:190px"></i>
  <i class="flag"></i>
  <div class="lander"><div class="craft">
    <i class="flame"></i>
    <i class=leg style="--r:28deg;left:24px"></i>
    <i class=leg style="--r:-28deg;left:72px"></i>
    <i class="stage"></i><i class="cabin"></i>
  </div></div>
</div>
<label for=go>LAND</label>
</body>
</html>
