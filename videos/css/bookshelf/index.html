<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick a book</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="shelf">
  <b style="--c:#b22;--h:150px"><i>Ember</i></b>
  <b style="--c:#25d;--h:172px"><i>Tides</i></b>
  <b style="--c:#184;--h:128px"><i>Moss</i></b>
  <b style="--c:#a60;--h:182px"><i>Atlas</i></b>
  <b style="--c:#72c;--h:156px"><i>Nebula</i></b>
  <b style="--c:#077;--h:140px"><i>Fjord</i></b>
  <b style="--c:#c41;--h:176px"><i>Comet</i></b>
  <label for=go style="--c:#b15;--h:162px">
    <i>Orbit</i></label>
  <b style="--c:#345;--h:134px"><i>Quartz</i></b>
  <b style="--c:#470;--h:166px"><i>Grove</i></b>
</div>
<div class="reader">
  <div class="cover"></div>
</div>
</body>
</html>
