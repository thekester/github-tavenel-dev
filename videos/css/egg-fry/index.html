<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fry an egg</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="pan">
  <b class="white"></b>
  <b class="yolk"></b>
  <i style="--x:100px;--y:16px;--d:0s"></i>
  <i style="--x:71px;--y:76px;--d:.4s"></i>
  <i style="--x:-10px;--y:106px;--d:.2s"></i>
  <i style="--x:-78px;--y:59px;--d:.5s"></i>
  <i style="--x:-110px;--y:9px;--d:.1s"></i>
  <i style="--x:-97px;--y:-61px;--d:.3s"></i>
  <i style="--x:-26px;--y:-89px;--d:.6s"></i>
  <i style="--x:55px;--y:-86px;--d:.25s"></i>
  <i style="--x:107px;--y:-45px;--d:.45s"></i>
  <i style="--x:-51px;--y:80px;--d:.15s"></i>
  <b class="shell"></b>
</div>
<label for=go class="btn">Crack</label>
</body>
</html>
