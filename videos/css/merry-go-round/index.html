<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merry-go-round</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <b class="roof"></b>
  <b class="lights"></b>
  <div class="stage">
    <div class="rotor">
      <b class="base"></b>
      <b class="column"></b>
      <p style="--a:0deg;--c:#f472b6">
        <i style="--d:0s"></i></p>
      <p style="--a:90deg;--c:#60a5fa">
        <i style="--d:.25s"></i></p>
      <p style="--a:180deg;--c:#fbbf24">
        <i style="--d:.5s"></i></p>
      <p style="--a:270deg;--c:#a78bfa">
        <i style="--d:.75s"></i></p>
    </div>
  </div>
</div>
<label for=go class="btn">Ride</label>
</body>
</html>
