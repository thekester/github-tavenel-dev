<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS abacus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="abacus">
  <div class="rod" style="--w:100;--c:#ef4444">
    <label><input type=checkbox id=h1></label>
    <label><input type=checkbox id=h2></label>
    <label><input type=checkbox id=h3></label>
    <label><input type=checkbox id=h4></label>
  </div>
  <div class="rod" style="--w:10;--c:#3b82f6">
    <label><input type=checkbox id=t1></label>
    <label><input type=checkbox id=t2></label>
    <label><input type=checkbox id=t3></label>
    <label><input type=checkbox id=t4></label>
  </div>
  <div class="rod" style="--w:1;--c:#22c55e">
    <label><input type=checkbox id=u1></label>
    <label><input type=checkbox id=u2></label>
    <label><input type=checkbox id=u3></label>
    <label><input type=checkbox id=u4></label>
  </div>
</div>
<p class="total"></p>
</body>
</html>
