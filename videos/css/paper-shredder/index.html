<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS paper shredder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="feed"><div class="doc"></div></div>
  <div class="shredder">
    <label for=go>Shred</label>
  </div>
  <i style="--i:0;--x:60px;--y:66px;
    --r:-86deg;--d:0.15s"></i>
  <i style="--i:1;--x:30px;--y:43px;
    --r:-94deg;--d:0.45s"></i>
  <i style="--i:2;--x:-30px;--y:54px;
    --r:84deg;--d:0.3s"></i>
  <i style="--i:3;--x:-55px;--y:77px;
    --r:92deg;--d:0s"></i>
  <div class="bin"></div>
</div>
</body>
</html>
