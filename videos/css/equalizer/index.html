<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS music player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=play>
<div class="card">
  <div class="art"></div>
  <h2>Night Drive</h2>
  <div class="eq">
    <i style="--h:0;--d:0.42s;--t:0s"></i>
    <i style="--h:24;--d:0.55s;--t:-0.2s"></i>
    <i style="--h:48;--d:0.36s;--t:-0.1s"></i>
    <i style="--h:72;--d:0.61s;--t:-0.35s"></i>
    <i style="--h:96;--d:0.47s;--t:-0.05s"></i>
    <i style="--h:120;--d:0.39s;--t:-0.25s"></i>
    <i style="--h:144;--d:0.58s;--t:-0.15s"></i>
    <i style="--h:168;--d:0.44s;--t:-0.3s"></i>
    <i style="--h:192;--d:0.33s;--t:-0.12s"></i>
    <i style="--h:216;--d:0.52s;--t:-0.22s"></i>
    <i style="--h:240;--d:0.65s;--t:-0.08s"></i>
    <i style="--h:264;--d:0.4s;--t:-0.18s"></i>
  </div>
  <div class="bar"></div>
  <label for=play></label>
</div>
</body>
</html>
