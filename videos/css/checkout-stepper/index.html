<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A checkout flow, zero JS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="radio" name="s" id="s0" checked>
<input type="radio" name="s" id="s1">
<input type="radio" name="s" id="s2">
<input type="radio" name="s" id="s3">
<div class="wizard">
  <div class="steps">
    <i style="--n:0">1</i>
    <i style="--n:1">2</i>
    <i style="--n:2">3</i>
    <i style="--n:3">4</i>
  </div>
  <div class="panels">
    <section>
      <h2>Your cart</h2>
      <p>2 items, $48</p>
      <label for="s1">Checkout</label>
    </section>
    <section>
      <h2>Shipping</h2>
      <p>Express, 2 days</p>
      <label for="s2">Continue</label>
    </section>
    <section>
      <h2>Payment</h2>
      <p>Card **** 4242</p>
      <label for="s3">Pay $48</label>
    </section>
    <section>
      <h2>Order placed!</h2>
      <p>Thanks, see you soon</p>
    </section>
  </div>
</div>
</body>
</html>
