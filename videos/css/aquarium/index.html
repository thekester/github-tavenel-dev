<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A living aquarium in CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="feed">
<div class="tank">
  <i class="weed"></i><i class="weed"></i>
  <i class="bubbles"></i>
  <i class="food"></i>
  <i class="fish"
    style="--c:#fb923c;--y:62%;--t:9s;--d:0s"></i>
  <i class="fish"
    style="--c:#facc15;--y:40%;--t:12s;--d:-5s"></i>
  <i class="fish"
    style="--c:#60a5fa;--y:75%;--t:10s;--d:-3s"></i>
</div>
<label for="feed">Feed</label>
</body>
</html>
