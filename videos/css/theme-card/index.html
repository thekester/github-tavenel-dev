<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark mode in one line of CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="dark">
<div class="card">
  <label for="dark" class="toggle"></label>
  <div class="avatar">TD</div>
  <h2>tavenel.dev</h2>
  <p>Front-end dev, CSS enjoyer</p>
  <div class="stats">
    <span><b>128</b> posts</span>
    <span><b>4.2k</b> followers</span>
  </div>
  <button>Follow</button>
  <nav>
    <label style="--c:#7c3aed">
      <input type="radio" name="a" id="c1">
    </label>
    <label style="--c:#e11d48">
      <input type="radio" name="a" id="c2">
    </label>
    <label style="--c:#0891b2">
      <input type="radio" name="a" id="c3">
    </label>
    <label style="--c:#16a34a">
      <input type="radio" name="a" id="c4">
    </label>
  </nav>
</div>
</body>
</html>
