<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sliding puzzle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=m8>
<input type=checkbox id=m5>
<input type=checkbox id=m6>
<div class="board">
  <b style="--c:0;--r:0">1</b>
  <b style="--c:1;--r:0">2</b>
  <b style="--c:2;--r:0">3</b>
  <b style="--c:0;--r:1">4</b>
  <label for=m8 style="--c:1;--r:1">8</label>
  <label for=m5 style="--c:2;--r:1">5</label>
  <b style="--c:0;--r:2">7</b>
  <label for=m6 style="--c:2;--r:2">6</label>
</div>
<p class="msg">Solved!</p>
</body>
</html>
