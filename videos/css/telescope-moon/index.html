<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telescope zoom</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=zoom>
<div class="sky">
  <i class="moon"></i>
  <i class="tripod"></i>
  <div class="scope">
    <label for=zoom class="eye"></label>
  </div>
  <div class="view"><b class="big"></b></div>
</div>
</body>
</html>
