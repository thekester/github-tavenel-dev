<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A radial menu in pure CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="m">
<div class="menu">
  <i style="--i:0" data-l="Edit">✎</i>
  <i style="--i:1" data-l="Mail">✉</i>
  <i style="--i:2" data-l="Star">★</i>
  <i style="--i:3" data-l="Settings">⚙</i>
  <i style="--i:4" data-l="Music">♫</i>
  <i style="--i:5" data-l="Call">☎</i>
  <label for="m"></label>
</div>
</body>
</html>
