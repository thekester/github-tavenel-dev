<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roast a marshmallow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="stick"><b class="mallow"></b></div>
  <div class="fire">
    <i style="--s:.6;--x:-26px;--d:-.3s"></i>
    <i style="--s:.65;--x:26px;--d:-.6s"></i>
    <i style="--s:1;--x:0px;--d:0s"></i>
  </div>
  <p class="badge">Perfect!</p>
</div>
<label for=go class="btn">Roast</label>
</body>
</html>
