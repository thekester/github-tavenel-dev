<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popsicle melt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <div class="sun"></div>
  <div class="stick">SMILE</div>
  <div class="ice"></div>
  <i style="--x:-38px;--d:.4s"></i>
  <i style="--x:30px;--d:1.1s;--c:#ec4899"></i>
  <i style="--x:-12px;--d:1.8s"></i>
  <div class="puddle"></div>
</div>
<label for=go class="btn">Wait</label>
</body>
</html>
