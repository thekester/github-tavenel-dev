<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>An hourglass in pure CSS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type="checkbox" id="flip">
<label for="flip" class="hourglass">
  <div class="glass">
    <i class="top"></i>
    <i class="bot"></i>
  </div>
  <i class="stream"></i>
</label>
</body>
</html>
