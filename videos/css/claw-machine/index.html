<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claw machine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="machine">
  <p class="sign">WIN!</p>
  <div class="glass">
    <div class="claw"><b></b><i></i></div>
    <u style="--x:84px;--y:0px;--c:#f472b6"></u>
    <u style="--x:148px;--y:0px;--c:#60a5fa"></u>
    <u style="--x:212px;--y:0px;--c:#4ade80"></u>
    <u class="prize" style="--x:168px;--y:46px;
      --c:#facc15"></u>
    <s class="chute"></s>
  </div>
  <div class="panel">
    <b class="joy"></b>
    <label for=go class="go">GO</label>
  </div>
</div>
</body>
</html>
