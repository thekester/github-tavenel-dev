<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music box</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <i class="lid"></i>
  <div class="box"><i class="drum"></i></div>
  <div class="dancer"><i></i></div>
  <b class="note" style="--x:-110px;--d:0s"></b>
  <b class="note" style="--x:90px;--d:.6s"></b>
  <b class="note" style="--x:-60px;--d:1.2s"></b>
  <b class="note" style="--x:120px;--d:1.8s"></b>
  <label for=go><i></i></label>
</div>
</body>
</html>
