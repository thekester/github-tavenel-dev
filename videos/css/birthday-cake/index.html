<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blow the candles</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="scene">
  <p class="msg">Happy Birthday!</p>
  <div class="wind"><i></i><i></i><i></i></div>
  <div class="candles">
    <i style="--d:.3s"></i>
    <i style="--d:.45s"></i>
    <i style="--d:.6s"></i>
    <i style="--d:.75s"></i>
    <i style="--d:.9s"></i>
  </div>
  <div class="cake"></div>
</div>
<label for=go>Blow</label>
</body>
</html>
