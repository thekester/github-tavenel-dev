<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS catapult</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=fire>
<div class="scene">
  <div class="arm"><b class="rock"></b></div>
  <div class="frame"></div>
  <div class="post"></div>
  <i style="--i:0;--x:0px;--r:0deg"></i>
  <i style="--i:1;--x:40px;--r:90deg"></i>
  <i style="--i:2;--x:78px;--r:160deg"></i>
  <i style="--i:3;--x:20px;--r:-80deg"></i>
  <div class="fly"><b class="rock"></b></div>
</div>
<label for=fire>Fire!</label>
</body>
</html>
