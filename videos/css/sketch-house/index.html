<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pencil sketch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=go>
<div class="page">
  <u style="--x:80;--y:210;--w:180;
    --h:140;--c:#fca5a5"></u>
  <u class=roof style="--x:60;--y:120;--w:220;
    --h:92;--c:#60a5fa;--t:4.5s"></u>
  <u style="--x:150;--y:285;--w:40;
    --h:65;--c:#b45309;--t:4.9s"></u>
  <u style="--x:205;--y:240;--w:35;
    --h:35;--c:#fde047;--t:4.9s"></u>
  <u style="--x:30;--y:345;--w:300;
    --h:24;--c:#4ade80;--t:5.2s"></u>
  <u class=sunf style="--x:258;--y:43;--w:64;
    --h:64;--c:#fbbf24;--t:4.5s"></u>
  <i style="--x:80;--y:210;--l:140;
    --r:90;--d:0"></i>
  <i style="--x:30;--y:350;--l:300;
    --r:0;--d:1"></i>
  <i style="--x:260;--y:350;--l:140;
    --r:-90;--d:2"></i>
  <i style="--x:260;--y:210;--l:180;
    --r:180;--d:3"></i>
  <i style="--x:60;--y:212;--l:143;
    --r:-40;--d:4"></i>
  <i style="--x:170;--y:120;--l:143;
    --r:40;--d:5"></i>
  <i style="--x:150;--y:350;--l:65;
    --r:-90;--d:6"></i>
  <i style="--x:150;--y:285;--l:40;
    --r:0;--d:7"></i>
  <i style="--x:190;--y:285;--l:65;
    --r:90;--d:8"></i>
  <b class=sun style="--x:258;--y:43;--s:3.4s">
  </b>
  <b style="--x:205;--y:240;--s:2.8s"></b>
</div>
<label for=go class="draw">Draw</label>
</body>
</html>
