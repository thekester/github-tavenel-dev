<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water the cactus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<input type=checkbox id=w1>
<input type=checkbox id=w2>
<input type=checkbox id=w3>
<div class="scene">
  <i class="can"></i>
  <label for=w1></label>
  <label for=w2></label>
  <label for=w3></label>
  <div class="cactus">
    <i class="arm l"></i><i class="arm r"></i>
    <b class="flower">
      <i style="--a:0deg"></i>
      <i style="--a:72deg"></i>
      <i style="--a:144deg"></i>
      <i style="--a:216deg"></i>
      <i style="--a:288deg"></i>
    </b>
  </div>
  <i class="pot"></i>
  <p class="count"></p>
</div>
</body>
</html>
