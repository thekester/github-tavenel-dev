<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strum the strings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="guitar">
  <i class="hole"></i>
  <i class="neck"></i>
  <i class="bridge"></i>
  <div class="strings">
    <i class=s1 style="--w:5px;
      --c:#d97706;--x:30%"><b>♪</b></i>
    <i class=s2 style="--w:4px;
      --c:#d97706;--x:62%"><b>♫</b></i>
    <i class=s3 style="--w:3.5px;
      --c:#e5a54b;--x:40%"><b>♪</b></i>
    <i class=s4 style="--w:2.5px;
      --c:#e7e5e4;--x:70%"><b>♫</b></i>
    <i class=s5 style="--w:2px;
      --c:#e7e5e4;--x:48%"><b>♪</b></i>
    <i class=s6 style="--w:1.5px;
      --c:#e7e5e4;--x:78%"><b>♫</b></i>
  </div>
</div>
</body>
</html>
